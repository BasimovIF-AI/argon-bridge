[package]
name = "argon-bridge"
version = "0.2.7"
edition = "2021"
authors = ["BasimovIF"]
description = "High-performance bridge between Google Gemini Web (Gemini 4 Argon) and Antigravity AI Agent"
license = "MIT"

[dependencies]
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "io-std", "net", "signal"] }
tokio-tungstenite = "0.23"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.8", features = ["v4"] }
chrono = "0.4"
